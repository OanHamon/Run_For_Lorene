# Blueprint Render : https://render.com/docs/blueprint-spec
# Démo à explorer : base MariaDB dans le conteneur, données fictives recréées à chaque démarrage.
# Aucune variable à saisir. Stripe peut être ajouté plus tard dans Environment (facultatif).
services:
  - type: web
    name: run-for-lorene
    runtime: docker
    plan: free
    region: frankfurt
    branch: deploiement-render
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Run For Lorène
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Générée par Render ; start.sh ajoute le préfixe « base64: » attendu par Laravel.
      - key: APP_KEY
        generateValue: true
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: APP_FAKER_LOCALE
        value: fr_FR
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      # Emails écrits dans les logs Render (liens « Créer mon mot de passe » visibles là).
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: noreply@runforlorene.fr
      - key: MAIL_FROM_NAME
        value: Run For Lorène
      - key: OPTIONS_ACTIVES
        value: "false"
